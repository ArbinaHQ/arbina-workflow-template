name: Reusable workflow v3. Build & push UI image

# v3 changes vs v2:
#   * Single source of truth for build — only Docker (no duplicate `npm install` / `npm run build` in CI).
#   * NPM auth via BuildKit secret (`--mount=type=secret`), never as build-arg.
#     => token does NOT appear in image history.
#   * Default Node 22 (LTS in 2026) instead of 16 (EOL).
#   * Default registry switched from GitHub Packages to Gitea private registry.
#   * Default `GIT_REVISION` env name (without legacy `REACT_` prefix; callers can override).
#   * `IS_BUILD_ENABLED: false` now skips the whole job, not just the CI step that nobody used.
#
# Caching: intentionally OFF. GHA cache I/O on the k8s-scale-runners turned out slower
# than rebuilding from scratch (network roundtrip > local `npm ci`). If runners move
# closer to GHA cache later, reintroduce `cache-from/cache-to: type=gha` on build-push.
#
# Required org secrets (used by default values below):
#   GITEA_TOKEN_RO_PACKAGES       — ci-bot PAT, scope read:package; for `npm ci` in Dockerfile.
#   ARBINA_K8S_ECR_REGISTRY       — ECR host (e.g. registry.k8s.arbina.com).
#   ARBINA_ECR_USERNAME, ARBINA_ECR_PASSWORD — ECR credentials.
#
# Dockerfile contract:
#   The caller's Dockerfile must consume the npmrc secret via BuildKit, e.g.:
#     RUN --mount=type=secret,id=npmrc,target=/root/.npmrc \
#         npm ci --no-audit --no-fund

on:
  workflow_call:
    inputs:
      MODULE_NAME:
        description: "Monorepo subdirectory to use as Docker build context. Default '.'."
        required: false
        type: string
        default: .
      ECR_REPOSITORY:
        description: "Image repository path inside ECR (without registry host)."
        required: true
        type: string
      GIT_REVISION_ENV_NAME:
        description: "Name of the .env variable for the git SHA. Default 'GIT_REVISION'."
        required: false
        type: string
        default: GIT_REVISION
      IS_ECR_PUSH_ENABLED:
        description: "Push the built image to ECR. Set false to dry-build only."
        required: true
        type: boolean
      IS_BUILD_ENABLED:
        description: "If false, the whole job is skipped (kill-switch)."
        required: false
        type: boolean
        default: true
      IMAGE_TAG_ECR:
        description: "Secondary image tag (in addition to the git SHA)."
        required: false
        type: string
        default: latest
      NODE_VERSION:
        description: "Node major version installed on the runner via actions/setup-node. .nvmrc in the repo wins if present. Note: the Dockerfile picks its own Node base image independently."
        required: false
        type: string
        default: '22'
      NPM_REGISTRY:
        description: "npm registry URL written into the BuildKit npmrc secret."
        required: false
        type: string
        default: https://gitea.arbina.com/api/packages/ArbinaHQ-private/npm/
      NPM_SCOPE:
        description: "npm scope to bind to NPM_REGISTRY in the npmrc."
        required: false
        type: string
        default: '@arbinahq'

jobs:
  ui-build-and-push-to-ecr:
    if: ${{ inputs.IS_BUILD_ENABLED }}
    runs-on: k8s-scale-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # setup-node only puts a Node binary on the runner for potential lint/test side
      # steps callers may add later. The actual `npm ci` happens inside Docker, not here.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.NODE_VERSION }}

      - name: Stamp git revision into .env
        run: echo "${{ inputs.GIT_REVISION_ENV_NAME }}=${{ github.sha }}" >> .env
        working-directory: ${{ inputs.MODULE_NAME }}

      - name: Build npmrc for BuildKit secret
        id: npmrc
        run: |
          {
            echo "${{ inputs.NPM_SCOPE }}:registry=${{ inputs.NPM_REGISTRY }}"
            # Strip the scheme so `host[/path]:` matches what npm looks up.
            registry_no_scheme="${{ inputs.NPM_REGISTRY }}"
            registry_no_scheme="${registry_no_scheme#https://}"
            registry_no_scheme="${registry_no_scheme#http://}"
            echo "//${registry_no_scheme}:_authToken=${NPM_TOKEN}"
            echo "always-auth=true"
          } > /tmp/.npmrc
          # Mask the resulting file content from logs.
          echo "::add-mask::$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.GITEA_TOKEN_RO_PACKAGES }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        uses: docker/login-action@v3
        with:
          registry: https://${{ secrets.ARBINA_K8S_ECR_REGISTRY }}
          username: ${{ secrets.ARBINA_ECR_USERNAME }}
          password: ${{ secrets.ARBINA_ECR_PASSWORD }}

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.MODULE_NAME }}
          push: ${{ inputs.IS_ECR_PUSH_ENABLED }}
          tags: |
            ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:${{ inputs.IMAGE_TAG_ECR }}
          build-args: |
            IMAGE_TAG=${{ github.sha }}
          # BuildKit secret — file mounted at /run/secrets/npmrc inside RUN steps
          # that opt into it via `--mount=type=secret,id=npmrc,target=/root/.npmrc`.
          # Crucially: the secret is NOT baked into any layer.
          secret-files: |
            npmrc=/tmp/.npmrc
