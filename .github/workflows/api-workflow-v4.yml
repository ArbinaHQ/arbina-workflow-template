name: Reusable workflow. Using to build, test and push API

on:
  workflow_call:
    inputs:
      MODULE_NAME:
        description: "Using for choice specified module when build application. 
                        If not present - used project directory for build and test"
        default: .
        type: string
      ECR_REPOSITORY:
        description: "Using for deploy docker image to ECR"
        required: true
        type: string
      BOOT_JAR_NAME:
        description: "Using for start docker container."
        required: true
        type: string
      IS_TEST_ENABLED:
        description: "Using for start test before pushing to ECR if value is true."
        required: true
        type: boolean
      IS_ECR_PUSH_ENABLED:
        description: "Using for pushing to ECR if value is true."
        required: true
        type: boolean
      IS_COPY_DOCKERFILE:
        description: "Using for copy default dockerfile from https://github.com/ArbinaHQ/arbina-github-runner/tree/master/docker/api."
        required: true
        type: boolean
      IS_COPY_DOCKER_DIRECTORY:
        description: "Using for copy default docker directory (entrypoint, cron, healthcheck) from https://github.com/ArbinaHQ/arbina-github-runner/tree/master/docker/api."
        required: true
        type: boolean
      JAVA_VERSION:
        description: "Using for set version Java in build"
        default: "25"
        required: false
        type: string
      GRADLE_VERSION:
        description: "Using for set version Gradle in build"
        default: "9.4.0"
        required: false
        type: string
      SPRING_BOOT_LOADER:
        description: "Used for run spring boot application"
        default: "org.springframework.boot.loader.launch.JarLauncher"
        required: false
        type: string

jobs:
  api-multi-module-workflow:
    runs-on: k8s-scale-runners
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build and test application in Docker
        if: ${{ inputs.IS_TEST_ENABLED }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CAN_READ_PACKAGES || secrets.GH_DEPBOT_TOKEN_CAN_READ_PACKAGES }}
          GITHUB_USERNAME: ${{ secrets.GH_USER_CAN_READ_PACKAGES || secrets.GH_DEPBOT_USER_CAN_READ_PACKAGES }}
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --workdir "/workspace/${{ inputs.MODULE_NAME }}" \
            --add-host host.docker.internal:host-gateway \
            --env GITHUB_TOKEN \
            --env GITHUB_USERNAME \
            --env BOOT_JAR_NAME=${{ inputs.BOOT_JAR_NAME }} \
            --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --env GRADLE_USER_HOME=/workspace/.gradle \
            ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod/arbina-gradle-jdk:${{ inputs.JAVA_VERSION }} \
            gradle bootJar test --parallel --no-daemon

      - name: Copy docker directory
        if: ${{ inputs.IS_COPY_DOCKER_DIRECTORY }}
        run: cp -r /docker/api-v3/docker ./
        working-directory: ${{ inputs.MODULE_NAME }}

      - name: Copy dockerfile
        if: ${{ inputs.IS_COPY_DOCKERFILE }}
        run: cp /docker/api-v3/Dockerfile ./
        working-directory: ${{ inputs.MODULE_NAME }}

      - name: Login to ECR
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        id: login-ecr
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}
          username: ${{ secrets.ARBINA_ECR_USERNAME }}
          password: ${{ secrets.ARBINA_ECR_PASSWORD }}

      - name: Build, tag, and push image to ECR
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        uses: docker/build-push-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CAN_READ_PACKAGES || secrets.GH_DEPBOT_TOKEN_CAN_READ_PACKAGES }}
          GITHUB_USERNAME: ${{ secrets.GH_USER_CAN_READ_PACKAGES || secrets.GH_DEPBOT_USER_CAN_READ_PACKAGES }}
        with:
          context: ${{ inputs.MODULE_NAME }}
          push: true
          tags: |
            ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:latest
          secret-envs: |
            github_username=GITHUB_USERNAME
            github_token=GITHUB_TOKEN
          build-args: |
            IMAGE_TAG=${{ github.sha }}
            JAVA_VERSION=${{ inputs.JAVA_VERSION }}
            BOOT_JAR_NAME=${{ inputs.BOOT_JAR_NAME }}
            SPRING_BOOT_LOADER=${{ inputs.SPRING_BOOT_LOADER }}
            ECR_REGISTRY=${{ secrets.ARBINA_K8S_ECR_REGISTRY }}/prod
            IS_TEST_ENABLED=${{ inputs.IS_TEST_ENABLED }}
