name: "Reusable workflow v4. Ultimate K8s ephemeral runner: build, test and push API"

on:
  workflow_call:
    inputs:
      MODULE_NAME:
        description: "Using for choice specified module when build application. 
                        If not present - used project directory for build and test"
        default: .
        type: string
      ECR_REPOSITORY:
        description: "Using for deploy docker image to ECR"
        required: true
        type: string
      BOOT_JAR_NAME:
        description: "Using for start docker container."
        required: true
        type: string
      IS_TEST_ENABLED:
        description: "Using for start test before pushing to ECR if value is true."
        required: true
        type: boolean
      IS_ECR_PUSH_ENABLED:
        description: "Using for pushing to ECR if value is true."
        required: true
        type: boolean
      IS_COPY_DOCKERFILE:
        description: "Using for copy default dockerfile from https://github.com/ArbinaHQ/arbina-github-runner/tree/master/docker/api."
        required: true
        type: boolean
      IS_COPY_DOCKER_DIRECTORY:
        description: "Using for copy default docker directory (entrypoint, cron, healthcheck) from https://github.com/ArbinaHQ/arbina-github-runner/tree/master/docker/api."
        required: true
        type: boolean
      IS_GRADLE_BUILD_CACHE_ENABLED:
        description: "Using for enable gradle build cache"
        default: true
        type: boolean
      JAVA_VERSION:
        description: "Using for set version Java in build"
        default: "25"
        required: false
        type: string
      SPRING_BOOT_LOADER:
        description: "Used for run spring boot application"
        default: "org.springframework.boot.loader.launch.JarLauncher"
        required: false
        type: string
      IS_ARBINA_DEPLOYMENT:
        description: "Using for switch ECR from arbina to sandbox"
        default: true
        type: boolean

jobs:
  api-multi-module-workflow:
    runs-on: k8s-scale-runners
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.repository }}-${{ github.ref }}-${{ inputs.MODULE_NAME }}
      cancel-in-progress: true

    env:
      ECR_REGISTRY: ${{ inputs.IS_ARBINA_DEPLOYMENT == true && secrets.ARBINA_K8S_ECR_REGISTRY || secrets.SANDBOX_K8S_ECR_REGISTRY }}
      ECR_USERNAME: ${{ secrets.ARBINA_ECR_USERNAME }}
      ECR_PASSWORD: ${{ secrets.ARBINA_ECR_PASSWORD }}
      # JVM tuning for ephemeral runners: no daemon, parallel GC, disable VFS watch (useless on ephemeral disk)
      GRADLE_OPTS: >-
        -Xmx2g
        -XX:+UseParallelGC
        -XX:MaxMetaspaceSize=512m
        -Dorg.gradle.vfs.watch=false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ inputs.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Build and test application
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CAN_READ_PACKAGES || secrets.GH_DEPBOT_TOKEN_CAN_READ_PACKAGES }}
          GITHUB_USERNAME: ${{ secrets.GH_USER_CAN_READ_PACKAGES || secrets.GH_DEPBOT_USER_CAN_READ_PACKAGES }}
          BOOT_JAR_NAME: ${{ inputs.BOOT_JAR_NAME }}
        run: |
          ./gradlew ${{ inputs.IS_TEST_ENABLED && 'bootJar test' || 'bootJar' }} -p ${{ inputs.MODULE_NAME }} --parallel --no-daemon ${{ inputs.IS_GRADLE_BUILD_CACHE_ENABLED && '--build-cache' || '--no-build-cache' }}

      - name: Copy docker directory
        if: ${{ inputs.IS_COPY_DOCKER_DIRECTORY }}
        run: cp -r /docker/api-v2/docker ./
        working-directory: ${{ inputs.MODULE_NAME }}

      - name: Copy dockerfile
        if: ${{ inputs.IS_COPY_DOCKERFILE }}
        run: cp /docker/api-v2/Dockerfile ./
        working-directory: ${{ inputs.MODULE_NAME }}

      # Buildx required for registry-based Docker layer cache
      - name: Set up Docker Buildx
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        uses: docker/setup-buildx-action@v4

      - name: Login to ECR
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        id: login-ecr
        uses: docker/login-action@v4
        with:
          registry: ${{ ECR_REGISTRY }}
          username: ${{ ECR_USERNAME }}
          password: ${{ ECR_PASSWORD }}

      - name: Build, tag, and push image to ECR
        if: ${{ inputs.IS_ECR_PUSH_ENABLED }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.MODULE_NAME }}
          push: true
          tags: |
            ${{ ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:latest
          build-args: |
            IMAGE_TAG=${{ github.sha }}
            JAVA_VERSION=${{ inputs.JAVA_VERSION }}
            BOOT_JAR_NAME=${{ inputs.BOOT_JAR_NAME }}
            SPRING_BOOT_LOADER=${{ inputs.SPRING_BOOT_LOADER }}
            ECR_REGISTRY=${{ ECR_REGISTRY }}/prod
          # Registry-based cache: layers stored in ECR, NOT in GHA cache (10GB limited).
          # Ephemeral runners have no local Docker cache — this makes rebuilds fast without filling GHA quota.
          cache-from: type=registry,ref=${{ ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ ECR_REGISTRY }}/prod/${{ inputs.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,compression=zstd
          # Disable provenance attestation — avoids multi-platform manifest overhead on single-arch builds
          provenance: false
